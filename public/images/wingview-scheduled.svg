<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Wing view over clouds at dawn">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071522"/>
      <stop offset=".48" stop-color="#17344a"/>
      <stop offset=".72" stop-color="#c47a37"/>
      <stop offset="1" stop-color="#172738"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4d0d8"/>
      <stop offset=".45" stop-color="#71808c"/>
      <stop offset="1" stop-color="#202b34"/>
    </linearGradient>
    <radialGradient id="sun">
