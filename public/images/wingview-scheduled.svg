  </g>
  <path d="M35 505 L380 332 L720 286 L1115 315 L1175 350 L735 354 L402 410 L110 520 Z" fill="url(#wing)" opacity=".92"/>
  <path d="M380 332 L720 286 L1115 315" fill="none" stroke="#e5edf2" stroke-opacity=".34" stroke-width="5"/>
  <path d="M735 354 L1175 350" fill="none" stroke="#0c141b" stroke-opacity=".5" stroke-width="8"/>
